<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Chessential</title>
  </head>
  <body>
    <div id="app">
      <div id="board"></div>

      <div id="sidebar">
        <h2>Game</h2>

        <div id="status">White to move</div>

        <div id="history"></div>
        <div id="controls">
          <button id="startBtn">⏮</button>
          <button id="prevBtn">◀</button>
          <button id="nextBtn">▶</button>
          <button id="endBtn">⏭</button>
        </div>

        <div id="gameActions">
          <button id="resignBtn">Resign</button>
          <button id="drawBtn">Offer Draw</button>
        </div>
        <div id="captured">
          <div class="captured-section">
            <h3>White captured</h3>
            <div id="whiteCaptured" class="captured-pieces"></div>
          </div>

          <div class="captured-section">
            <h3>Black captured</h3>
            <div id="blackCaptured" class="captured-pieces"></div>
          </div>
        </div>
        <div id="pgnSection">
          <button id="exportPgnBtn">Export PGN</button>

          <textarea id="pgnInput" placeholder="Paste PGN here..."></textarea>

          <button id="importPgnBtn">Import PGN</button>
        </div>
        <button id="openSettingsBtn">⚙ Settings</button>
      </div>
    </div>

    <div id="gameOverModal" class="hidden">
      <div id="modalContent">
        <h2 id="gameOverTitle"></h2>

        <p id="gameOverText"></p>

        <div id="modalButtons">
          <button id="newGameBtn">New Game</button>
          <button id="reviewBtn">Review Game</button>
        </div>
      </div>
    </div>
    <div id="promotionModal" class="hidden">
      <div id="promotionContent">
        <h3>Choose Promotion</h3>

        <div id="promotionChoices"></div>
      </div>
    </div>
    <div id="settingsModal" class="hidden">
      <div id="settingsContent">
        <h2>Settings</h2>

        <div class="setting">
          <label for="themeSelect">Theme</label>

          <select id="themeSelect">
            <option value="classic">Classic</option>
            <option value="wood">Wood</option>
            <option value="neon">Neon</option>
          </select>
        </div>

        <div class="setting">
          <label>
            <input type="checkbox" id="soundToggle" checked />

            Sound
          </label>
        </div>

        <div class="setting">
          <label>
            <input type="checkbox" id="flipToggle" />

            Flip Board
          </label>
        </div>

        <div class="setting">
          <label>
            <input type="checkbox" id="coordsToggle" checked />

            Coordinates
          </label>
        </div>

        <button id="closeSettingsBtn">Close</button>
      </div>
    </div>
    <script src="libs/chess.js"></script>
    <script src="main.js"></script>
  </body>
</html>
